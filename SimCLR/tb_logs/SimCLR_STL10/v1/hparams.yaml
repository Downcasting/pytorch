dataset:
  classes: 10
  input_size: 96
  name: stl10
model:
  backbone: resnet18
  projection_dim: 512
optimization:
  cosine: true
  optimizer: LARS
  scheduler: true
  warmup: true
training:
  batch_size: 256
  learning_rate: 0.6
  max_epochs: 500
  temperature: 0.5
  warmup_epochs: 5
transform:
  gaussian_blur: true
  jitter_strength: 0.5
  normalize:
    mean:
    - 0.4467
    - 0.4398
    - 0.4066
    std:
    - 0.2242
    - 0.2215
    - 0.2239
