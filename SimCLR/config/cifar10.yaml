dataset:
    name: cifar10
    input_size: 32

training:
    batch_size: 512
    epochs: 1000
    warmup_epochs: 5
    learning_rate: 0.4
    temperature: 0.5

optimization:
    optimizer: SGD
    scheduler: True
    warmup: True
    cosine: True

model:
    backbone: resnet18
    projection_dim: 512

transform:

    RandomResizedCrop:
        size: 32
        scale: [0.2, 1.0]
    RandomHorizontalFlip:
        p: 0.5
    ColorJitter:
        brightness: 0.4
        contrast: 0.4
        saturation: 0.4
        hue: 0.1
    Normalize:
        mean: [0.4914, 0.4822, 0.4465]
        std: [0.2023, 0.1994, 0.2010]
