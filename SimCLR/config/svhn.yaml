dataset:
    name: svhn
    input_size: 32

training:
    batch_size: 512
    max_epochs: 1000
    warmup_epochs: 
    learning_rate: 
    temperature: 0.5

optimization:
    optimizer: SGD
    scheduler: True
    warmup: True
    cosine: True

model:
    backbone: resnet18
    projection_dim: 512

transform:
    gaussian_blur: 
    normalize:
        mean: [0.4377, 0.4438, 0.4728]
        std: [0.1201, 0.1231, 0.1052]
    jitter_strength: 0.5