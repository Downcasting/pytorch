cfg:
  dataset:
    classes: 10
    global_crop_size: 28
    input_size: 32
    local_crop_size: 16
    name: cifar10
  model:
    student_backbone: vitti
    student_projection_dim: 512
    teacher_backbone: vitti
    teacher_projection_dim: 512
  optimization:
    cosine: true
    optimizer: AdamW
    warmup: true
  training:
    batch_size: 128
    learning_rate: 0.0005
    max_epochs: 100
    temperature: 0.1
    warmup_epochs: 10
  transform:
    gaussian_blur: true
    jitter_strength: 0.5
    normalize:
      mean:
      - 0.4914
      - 0.4822
      - 0.4465
      std:
      - 0.2023
      - 0.1994
      - 0.201
feature_dim: 192
version: 2
